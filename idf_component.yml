version: "1.4.2"
description: TensorFlow Lite Micro component for ESP-IDF
url: https://github.com/espressif/esp-tflite-micro
repository: https://github.com/espressif/esp-tflite-micro.git
issues: https://github.com/espressif/esp-tflite-micro/issues
documentation: https://github.com/espressif/esp-tflite-micro#readme

dependencies:
  idf:
    version: ">=5.1"
  espressif/esp-nn:
    # >=1.4.2: the batched per-channel FC on ESP32-S3 without a stack array
